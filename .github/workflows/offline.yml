name: Offline scoring checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Provision Pillow 12.0.0 for Stage-2 offline contact-sheet checks
        run: python3 -m pip install --no-cache-dir Pillow==12.0.0
      - run: node --test
      - name: Render the synthetic batch without provider access
        run: node src/cli.mjs --input fixtures/synthetic-batch.json --profile docs/design/reference-profile.r59.draft.json --output outputs/ci-example
      - name: Smoke-test Phase 2 offline CLI without provider access
        run: |
          node src/phase2-cli.mjs init --db outputs/ci-phase2.sqlite
          node src/phase2-cli.mjs export-report --db outputs/ci-phase2.sqlite --batch fixtures/synthetic-batch.json --profile docs/design/reference-profile.r59.draft.json --output outputs/ci-phase2-report
          node --input-type=module -e "import { createHash } from 'node:crypto'; import { readFileSync, writeFileSync } from 'node:fs'; import { openSelectionStore } from './src/store.mjs'; const f = JSON.parse(readFileSync('fixtures/synthetic-batch.json','utf8')); const asins = ['B000000001','B000000002','B000000003']; const st = openSelectionStore('outputs/ci-phase2.sqlite'); const receiptFiles = []; const expectedShas = {}; f.candidates.forEach((c, i) => { c.screening.reference_price_usd.target_variant_asin = asins[i]; const items = [{ asin: asins[i], price: 40 }]; if (i === 1) { c.economics.scenarios[1].price_anchor.target_variant_asin = 'B000000012'; items.push({ asin: asins[i], price: 31.25 }, { asin: 'B000000012', price: 42.85714285714286 }); } const rName = 'ci-synth-r' + (i + 1) + '.json'; const payload = { code: 'OK', items }; const bytes = Buffer.from(JSON.stringify(payload)); writeFileSync('outputs/' + rName, bytes); expectedShas[rName] = createHash('sha256').update(bytes).digest('hex'); receiptFiles.push(rName); const att = st.reserveRequestAttempt({ account_scope: 'ci-smoke', provider: 'sellersprite', tool_name: 'product_research', observation_cutoff_date: '2026-11-22', params: { asin: asins[i] }, estimated_ss_mcp_units: 1 }); st.markAttemptInFlight(att.attempt_id); st.completeAttempt(att.attempt_id, { payload, ss_mcp_units: 1 }); }); st.close(); const pkg = { length_in: 12, width_in: 8, height_in: 4, unit_weight_lb: 1.5 }; writeFileSync('outputs/ci-sp-cal.json', JSON.stringify({ price_usd: 49.99, catalogItemRaw: { asin: 'B000000001', dimensions: [{ package: { length: { value: 12, unit: 'inches' }, width: { value: 8, unit: 'inches' }, height: { value: 4, unit: 'inches' }, weight: { value: 1.5, unit: 'pounds' } } }] }, sellerSpriteCachedRow: { length_in: 12, width_in: 8, height_in: 4, unit_weight_lb: 4.5 } })); writeFileSync('outputs/ci-g1a.json', JSON.stringify({ form: { form_id: 'ci-2q-form', product_family_key: 'ci-2q-form', label: 'CI 2-quote form', buyer_task: 'Task', saleable_set_composition: [{ component_id: 'item', qty_per_saleable_set: 1 }] }, scenarios: [{ id: 'sc-ci-40', price_usd: 40, available_date: '2025-05-01', pkg, fx_cny_per_usd: 7.2, refund_fraction: 0.04, physical_return_fraction: 0.04, fee_category: 'Home and Kitchen', referral_terms: { referral_fraction: 0.15, refund_admin_fraction: 0.2, refund_admin_cap_usd: 5, minimum_referral_usd: 0.3 }, headhaul_usd: 2.0, collection_rate: 0.005, other_applicable_usd: 0, sales_window: { from: '2027-02-01', through: '2027-10-14' }, storage_window: { from: '2027-02-01', through: '2027-09-30' }, inbound_window: { from: '2027-01-15', through: '2027-10-14' } }] })); writeFileSync('outputs/ci-r59-spec.json', JSON.stringify({ profile_revision: 59, raw_receipt_files: receiptFiles, expected_raw_sha256s: expectedShas, candidates: f.candidates.map((c, i) => ({ candidate: c, raw_receipt_files: [receiptFiles[i]] })) }));"
          node src/phase2-cli.mjs sp-api-calibrate --input outputs/ci-sp-cal.json --output outputs/ci-sp-cal-out.json
          node src/phase2-cli.mjs gate1a --db outputs/ci-phase2.sqlite --input outputs/ci-g1a.json --profile-revision 59 > outputs/ci-g1a-out.json
          node --input-type=module -e "import { readFileSync, writeFileSync } from 'node:fs'; const d = JSON.parse(readFileSync('outputs/ci-g1a-out.json','utf8')).result.declared_scenarios[0]; const pkg = { length_in: 12, width_in: 8, height_in: 4, unit_weight_lb: 1.5 }; const ui = { logged_in: true, viewport_width_px: 1440, selected_sku_row_visible: true, settlement_bar_visible: true, applied_quantity_confirmed: true }; writeFileSync('outputs/ci-g1b-2q.json', JSON.stringify({ form_id: 'ci-2q-form', as_of_date: '2026-11-22', quotes: [{ quote_id: 'ci-q-lose', observed_at: '2026-11-22T10:00:00Z', redacted_destination: '广东深圳', raw_readback_ref: 'ev-l', goods_first_order_promotion: false, freight_first_order_promotion: false, fx_cny_per_usd: 7.2, pkg, ui_readback: ui, sku_lines: [{ component_id: 'item', offer_id: 'ol', sku_id: 'sl', pack_multiple: 1, qty_per_saleable_set: 1, moq_qty: 10, ordered_qty: 100, unit_price_cny: 135, regular_goods_promo_false: true }], goods_cny_total: 13500, domestic_freight_cny_total: 900 }, { quote_id: 'ci-q-win', observed_at: '2026-11-22T10:05:00Z', redacted_destination: '广东深圳', raw_readback_ref: 'ev-w', goods_first_order_promotion: false, freight_first_order_promotion: false, fx_cny_per_usd: 7.2, pkg, ui_readback: ui, sku_lines: [{ component_id: 'item', offer_id: 'ow', sku_id: 'sw', pack_multiple: 1, qty_per_saleable_set: 1, moq_qty: 10, ordered_qty: 100, unit_price_cny: 35, regular_goods_promo_false: true }], goods_cny_total: 3500, domestic_freight_cny_total: 250 }], early_screen_scenarios: [{ profile_revision: 59, id: d.id, saleable_unit: '1 unit', price_usd: d.price_usd, fx_cny_per_usd: d.fx_cny_per_usd, pkg, headhaul: { usd_per_unit: d.headhaul_usd, bond_included: true }, refund_fraction: 0.04, physical_return_fraction: 0.04, return_threshold: 0.081, returns_processing_usd: 0, is_apparel_or_shoes: false, referral_terms: { referral_fraction: 0.15, refund_admin_fraction: 0.2, refund_admin_cap_usd: 5, minimum_referral_usd: 0.3 }, fulfillment_usd: d.fulfillment_usd, placement_usd: d.placement_range_usd[1], storage: { cubic_feet_per_unit: (12*8*4)/1728, rate_usd_per_cuft_month: 0.78, average_inventory_days: 45 }, operating_period: 'off_peak', operating_months: [2,3,4,5,6,7,8,9,10], fee_context: { marketplace: 'US', currency: 'USD', package_ref: 'p1', sales: { from: '2027-02-01', through: '2027-10-14' }, storage: { from: '2027-02-01', through: '2027-09-30' }, inbound: { from: '2027-01-15', through: '2027-10-14' } }, collection_rate: 0.005, other_applicable_usd: 0, specific_rights_conflict: 'unknown', strong_date_dependency: false }] }));"
          node src/phase2-cli.mjs gate1b --db outputs/ci-phase2.sqlite --input outputs/ci-g1b-2q.json --profile-revision 59
          node src/phase2-cli.mjs ingest-trial --db outputs/ci-phase2.sqlite --input outputs/ci-r59-spec.json --profile docs/design/reference-profile.r59.draft.json --output outputs/ci-r59.batch.json
          node src/phase2-cli.mjs export-report --db outputs/ci-phase2.sqlite --batch outputs/ci-r59.batch.json --profile docs/design/reference-profile.r59.draft.json --output outputs/ci-phase2-report-r59
          node src/phase2-cli.mjs serve-report --dir outputs/ci-phase2-report-r59 --check
          node src/phase2-cli.mjs coverage --db outputs/ci-phase2.sqlite
          node src/phase2-cli.mjs plan-discovery --db outputs/ci-phase2.sqlite --budget 5
